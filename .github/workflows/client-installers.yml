name: Installers - Android Windows macOS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Platform to build (all builds four installers)
        type: choice
        required: true
        default: all
        options:
          - all
          - android-arm64-v8a
          - windows-amd64
          - macos-amd64
          - macos-arm64
      flutter_version:
        description: Flutter SDK version
        type: string
        required: true
        default: '3.47.9'
      metron_base_url:
        description: Backend HTTPS URL
        type: string
        required: true
      metron_subscription_base_url:
        description: Subscription HTTPS origin (no path)
        type: string
        required: true
      crisp_website_id:
        description: Crisp Website ID (UUID)
        type: string
        required: true
      app_display_name:
        description: Application display name
        type: string
        required: true
      app_version:
        description: Application version (x.y.z)
        type: string
        required: true
      app_build_number:
        description: Build number (integer, increase for each release)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: client-installers-${{ github.ref }}-${{ inputs.build_target || 'all' }}
  cancel-in-progress: true

env:
  SENTRY_BACKEND: none
  GOTOOLCHAIN: local
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.workers.max=2 -Dorg.gradle.caching=false

jobs:
  select-targets:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Create selected build matrix
        id: select
        shell: pwsh
        env:
          BUILD_TARGET: ${{ inputs.build_target || 'all' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            @{ id='android-arm64-v8a'; platform='android'; arch='arm64'; os='ubuntu-24.04'; sdk_arch='x64'; rust_target='aarch64-linux-android'; go_version='1.25.x' }
            @{ id='windows-amd64'; platform='windows'; arch='amd64'; os='windows-2022'; sdk_arch='x64'; rust_target='x86_64-pc-windows-msvc'; go_version='1.24.x' }
            @{ id='macos-amd64'; platform='macos'; arch='amd64'; os='macos-26-intel'; sdk_arch='x64'; rust_target='x86_64-apple-darwin'; go_version='1.25.x' }
            @{ id='macos-arm64'; platform='macos'; arch='arm64'; os='macos-26'; sdk_arch='arm64'; rust_target='aarch64-apple-darwin'; go_version='1.25.x' }
          )
          $selected = @($targets | Where-Object { $env:BUILD_TARGET -eq 'all' -or $_.id -eq $env:BUILD_TARGET })
          if ($selected.Count -eq 0) { throw "Unsupported build target: $env:BUILD_TARGET" }
          $matrix = @{ include = $selected } | ConvertTo-Json -Depth 4 -Compress
          "matrix=$matrix" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "Selected targets: $(($selected | ForEach-Object { $_.id }) -join ', ')" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  installers:
    name: ${{ matrix.id }} installer
    needs: select-targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      METRON_BASE_URL: ${{ inputs.metron_base_url }}
      METRON_SUBSCRIPTION_BASE_URL: ${{ inputs.metron_subscription_base_url }}
      CRISP_WEBSITE_ID: ${{ inputs.crisp_website_id }}
      APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
      APP_VERSION: ${{ inputs.app_version }}
      APP_BUILD_NUMBER: ${{ inputs.app_build_number }}

    steps:
      - name: Free disk space for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo 'Skipping preinstalled-tool cleanup on a non-GitHub-hosted runner.'
            exit 0
          fi
          sdk_root="$(realpath "${ANDROID_SDK_ROOT:-$ANDROID_HOME}")"
          if [[ "$sdk_root" != '/usr/local/lib/android/sdk' ]]; then
            echo 'Unexpected Android SDK location; refusing runner cleanup.' >&2
            exit 1
          fi
          df -h /
          # This job does not use .NET, Swift, Haskell, CodeQL or an emulator.
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf -- "$sdk_root/system-images" "$sdk_root/emulator"
          shopt -s nullglob
          for ndk in "$sdk_root"/ndk/*; do
            if [[ -d "$ndk" && "${ndk##*/}" != '28.2.13676358' ]]; then
              sudo rm -rf -- "$ndk"
            fi
          done
          sudo apt-get clean
          df -h /
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          if (( available_kib < 20 * 1024 * 1024 )); then
            echo 'Less than 20 GiB free before Android setup; refusing a build that may exhaust the runner disk.' >&2
            exit 1
          fi

      - name: Enable long paths on Windows
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Checkout source and core
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate source and resolve client configuration
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('pubspec.yaml', 'core/Clash.Meta/go.mod', 'tools/client.ps1', 'tools/build-installers.ps1')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing source file: $file. Upload Bettbox-main contents at repository root." }
          }
          ./tools/client.ps1 -Action Prepare
          "RESOLVED_CLIENT_CONFIG=.dart_tool/client-build-inputs.json" | Add-Content -LiteralPath $env:GITHUB_ENV
          "### $env:BUILD_PLATFORM / $env:BUILD_ARCH`nBuild configuration validated." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Setup Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
          cache: ${{ matrix.platform != 'android' }}
          cache-dependency-path: |
            core/go.sum
            core/Clash.Meta/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Configure Android Rust linker
        if: matrix.platform == 'android'
        run: |
          $linker = Join-Path $env:ANDROID_NDK 'toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          if (!(Test-Path -LiteralPath $linker)) { throw 'Android NDK linker missing.' }
          "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          architecture: ${{ matrix.sdk_arch }}
          cache: true

      - name: Setup Windows NuGet
        if: matrix.platform == 'windows'
        uses: NuGet/setup-nuget@v3

      - name: Ensure Inno Setup installer compiler
        if: matrix.platform == 'windows'
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 compiler not found.' }

      - name: Prepare Flutter dependencies
        run: |
          if ($env:BUILD_PLATFORM -eq 'macos') {
            flutter config --enable-macos-desktop --no-enable-swift-package-manager
            if ($LASTEXITCODE -ne 0) { throw 'macOS Flutter configuration failed.' }
            xcodebuild -version
            if ($LASTEXITCODE -ne 0) { throw 'Xcode unavailable.' }
          }
          if ($env:BUILD_PLATFORM -eq 'windows') {
            flutter config --enable-windows-desktop
            if ($LASTEXITCODE -ne 0) { throw 'Windows desktop configuration failed.' }
          }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter pub get failed.' }
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { throw 'Dart code generation failed.' }

      - name: Install Android release signing key
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('KEYSTORE', 'KEY_ALIAS', 'STORE_PASSWORD', 'KEY_PASSWORD')) {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Android signing secret: $name. See INSTALLERS-GITHUB.txt."
            }
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'android/app/keystore.jks'), [Convert]::FromBase64String($env:KEYSTORE))
          function PropertyValue([string] $value) {
            $escaped = $value.Replace('\', '\\')
            return [regex]::Replace($escaped, '[^\x21-\x7e]', { param($match) '\u' + ([int][char]$match.Value[0]).ToString('x4') })
          }
          $lines = @(
            ('keyAlias=' + (PropertyValue $env:KEY_ALIAS))
            ('storePassword=' + (PropertyValue $env:STORE_PASSWORD))
            ('keyPassword=' + (PropertyValue $env:KEY_PASSWORD))
          )
          [IO.File]::AppendAllText((Join-Path $PWD 'android/local.properties'), "`n" + ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

      - name: Build and verify installer
        id: package
        run: ./tools/build-installers.ps1 -Platform $env:BUILD_PLATFORM -Architecture $env:BUILD_ARCH -ConfigPath $env:RESOLVED_CLIENT_CONFIG

      - name: Upload installer file directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA256 file directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.installer }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing files
        if: always() && matrix.platform == 'android'
        run: |
          foreach ($path in @('android/app/keystore.jks', 'android/local.properties')) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
